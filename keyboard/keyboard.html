<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Keyboard</title>
      <link rel="stylesheet" href="../top_bar_style.css?v=4">
      <link rel="stylesheet" href="style.css?v=1">
   </head>

   <body>
      <div id="top_bar">
         <a href="../index.html">Overview</a>
         <a href="../dictionary/index.html">Dictionary</a>
         <a href="../grammar_rules/index.html">Grammar</a>
      </div>

      <div id="body">
         <h1>Kahnur Keyboard</h1>

         <div id="search_wrapper">
            <textarea id="search_bar" placeholder="Start Typing...""></textarea>
         </div>

         <div id="info">
            <p id="shift_info">Shift: Off</p>
            <p id="caps_info">Caps Lock: Off</p>
         </div>

         <div id="keys">
            <div class="row">
               <button>`<p class="skey">~</p></button>
               <button>1<p class="skey">!</p></button>
               <button>2<p class="skey">@</p></button>
               <button>3<p class="skey">#</p></button>
               <button>4<p class="skey">$</p></button>
               <button>5<p class="skey">%</p></button>
               <button>6<p class="skey">^</p></button>
               <button>7<p class="skey">&</p></button>
               <button>8<p class="skey">*</p></button>
               <button>9<p class="skey">(</p></button>
               <button>0<p class="skey">)</p></button>
               <button>-<p class="skey">_</p></button>
               <button>=<p class="skey">+</p></button>
               <button class="ignore" id="del">del</button>
            </div>
            <div class="row">
               <button class="ignore" id="tab">tab</button>
               <button>ყ<p class="skey alpha">a</p></button>
               <button>ჟ<p class="skey alpha">b</p></button>
               <button>ვ<p class="skey alpha">c</p></button>
               <button>მ<p class="skey alpha">d</p></button>
               <button>ჲ<p class="skey alpha">e</p></button>
               <button>ჩ<p class="skey alpha">f</p></button>
               <button>ბ<p class="skey alpha">g</p></button>
               <button>ჰ<p class="skey alpha">h</p></button>
               <button>უ<p class="skey alpha">j</p></button>
               <button>შ<p class="skey alpha">m</p></button>
               <button>ნ<p class="skey alpha">n</p></button>
               <button>ო<p class="skey alpha">o</p></button>
               <button class="ignore" id="clear">clear</button>
            </div>
            <div class="row">
               <button class="ignore" id="caps">caps</button>
               <button>ღ<p class="skey alpha">p</p></button>
               <button>გ<p class="skey alpha">r</p></button>
               <button>ს<p class="skey alpha">t</p></button>
               <button>ი<p class="skey alpha">u</p></button>
               <button>ძ<p class="skey alpha">v</p></button>
               <button>ა<p class="skey alpha">z</p></button>
               <button>ფ<p class="skey alpha">ac</p></button>
               <button>ხ<p class="skey alpha">ad</p></button>
               <button>ლ<p class="skey alpha">an</p></button>
               <button>თ<p class="skey alpha">az</p></button>
               <button>კ<p class="skey alpha">en</p></button>
               <button class="ignore" id="enter">enter</button>
            </div>
            <div class="row">
               <button class="ignore" id="shift">shift</button>
               <button>ჯ<p class="skey alpha">ja</p></button>
               <button>ქ<p class="skey alpha">ra</p></button>
               <button>ც<p class="skey alpha">ta</p></button>
               <button>პ<p class="skey alpha">tz</p></button>
               <button>ზ<p class="skey alpha">un</p></button>
               <button>რ<p class="skey alpha">va</p></button>
               <button>დ<p class="skey alpha">za</p></button>
               <button>ტ<p class="skey alpha">zh</p></button>
               <button>წ<p class="skey alpha">zt</p></button>
               <button>ჭ<p class="skey alpha">tag</p></button>
               <button>ე<p class="skey alpha">zun</p></button>
               <button class="ignore" id="rshift">shift</button>
            </div>
            <div class="row">
               <button>,<p class="skey">&lt;</p></button>
               <button>.<p class="skey">&gt;</p></button>
               <button>;<p class="skey">:</p></button>
               <button>'<p class="skey">"</p></button>
               <button class="ignore" id="space">space</button>
               <button>/<p class="skey">?</p></button>
               <button>\<p class="skey">|</p></button>
               <button>[<p class="skey">{</p></button>
               <button>]<p class="skey">}</p></button>
            </div>
         </div>
      </div>

      <script src="script.js?v=1"></script>
   </body>
</html>
